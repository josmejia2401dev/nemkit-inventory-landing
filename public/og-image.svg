    <text x="78" y="407" fill="#fffdf5" font-size="62" font-weight="700" letter-spacing="-2">más <tspan fill="#e2cc91">organizado.</tspan></text>
    <text x="82" y="463" fill="#cfdbcf" font-size="22">Inventario, ventas, compras, cocina</text>
    <text x="82" y="494" fill="#cfdbcf" font-size="22">y domicilios en un solo lugar.</text>
    <rect x="82" y="535" width="236" height="55" rx="14" fill="#ead59d"/>
    <text x="108" y="570" fill="#234b39" font-size="18" font-weight="700">Conoce Nemkit  →</text>
  </g>
  <g transform="translate(695 132)">
