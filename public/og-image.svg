    <path d="M34 47a27 27 0 0 1 27-27h336a27 27 0 0 1 27 27v27H34V47Z" fill="#e8eee4"/>
    <circle cx="65" cy="47" r="6" fill="#b9c7b8"/><circle cx="86" cy="47" r="6" fill="#b9c7b8"/><circle cx="107" cy="47" r="6" fill="#b9c7b8"/>
    <text x="64" y="111" fill="#6c7c6d" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">RESUMEN DE TU NEGOCIO</text>
    <rect x="64" y="132" width="150" height="94" rx="15" fill="#f3f6ef" stroke="#e0e8dd"/>
    <rect x="230" y="132" width="164" height="94" rx="15" fill="#f8f2e5" stroke="#eee4ce"/>
    <text x="82" y="164" fill="#758577" font-family="Arial,sans-serif" font-size="12">Productos activos</text>
    <text x="82" y="202" fill="#285944" font-family="Arial,sans-serif" font-size="32" font-weight="700">248</text>
    <text x="248" y="164" fill="#9b8660" font-family="Arial,sans-serif" font-size="12">Ventas del mes</text>
    <text x="248" y="202" fill="#7a6845" font-family="Arial,sans-serif" font-size="29" font-weight="700">$ 8.4 M</text>
