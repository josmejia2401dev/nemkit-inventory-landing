<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Nemkit para tiendas y restaurantes</title>
  <desc id="description">Inventario, ventas, compras, cocina y domicilios conectados en un solo lugar.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17382f"/>
      <stop offset="1" stop-color="#285944"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef8"/>
      <stop offset="1" stop-color="#eef3e9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1045" cy="90" r="260" fill="#e6d4a5" opacity=".08"/>
  <circle cx="1080" cy="550" r="210" fill="#d5e1c9" opacity=".07"/>
  <g transform="translate(80 72)">
